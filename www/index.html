<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>學詞吧</title>
<meta name="description" content="音樂劇歌詞本：貼上歌詞，邊讀邊記單字，資料存進自己的 Google 試算表">
<meta name="theme-color" id="theme-color" content="#faf7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="學詞吧">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* 主題要在畫面畫出來之前決定，否則會先閃一下淺色。
   photo（粉紫、自訂背景）的底圖與字色由 app.js 接手設定。 */
(function () {
  try {
    var pref = localStorage.getItem('xc.theme') || 'light';
    var root = document.documentElement;
    if (pref === 'glow' || pref === 'custom') {
      root.dataset.theme = 'photo';
      root.dataset.tone = 'dark';
      return;
    }
    var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
</head>
<body>
<div class="bg"></div><div class="dim"></div>
<div class="app">
  <header class="top">
    <button class="ico" id="btn-back" aria-label="上一頁" hidden></button>
    <h1 id="title">學詞吧</h1>
    <span class="sync" id="sync"></span>
    <button class="ico" id="btn-gear" aria-label="設定"></button>
  </header>
  <main id="view"></main>
  <div id="pickbar"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="pop" hidden></div>
<div id="sheets"></div>
<script src="lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
